name: Gestão de Line – publicar no GitHub Pages

on:
  push:
    branches: [ccr-7ee1cadd-g5mq8h, claude/gestao-line-app-ro7rri]
    paths: ['gestao-line/**', '.github/workflows/gestao-line-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao-line
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gestao-line/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # lê gestao-line/.env.production (URL + chave pública)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gestao-line/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
